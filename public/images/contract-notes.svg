<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .doc-title { font-size: 13px; font-weight: bold; fill: #000; font-family: Arial, sans-serif; }
      .doc-subtitle { font-size: 10px; fill: #333; font-family: Arial, sans-serif; }
      .doc-header { font-size: 8.5px; fill: #333; font-family: Arial, sans-serif; }
      .doc-border { stroke: #333; stroke-width: 1.5; }
      .border-light { stroke: #999; stroke-width: 0.8; }
      .doc-bg { fill: #ffffff; }
    </style>
  </defs>

  <!-- Outer border -->
  <rect x="20" y="20" width="860" height="610" class="doc-bg doc-border"/>

  <!-- Title Section -->
  <text x="450" y="45" text-anchor="middle" class="doc-title">CONTRACT NOTE CUM TAX INVOICE</text>
  <text x="450" y="60" text-anchor="middle" class="doc-subtitle">(Tax Invoice under Section 31 of GST Act)</text>

  <!-- Member Info Section (with border) -->
  <rect x="20" y="75" width="860" height="60" class="border-light" fill="#f5f5f5"/>
  <text x="30" y="90" class="doc-header">NAME OF THE MEMBER, LOGO OF THE MEMBER</text>
  <text x="30" y="103" class="doc-header">SEBI REGISTRATION NO. ADDRESS, TELEPHONE NO, FAX NO AND WEBSITE</text>
  <text x="30" y="116" class="doc-header">NAME OF COMPLIANCE OFFICER HIS/HER EMAIL & TELEPHONE NO., EMAIL ID FOR INVESTOR COMPLAINT</text>
  <text x="30" y="129" class="doc-header">DEALING OFFICES ADDRESS, TELEPHONE NO, FAX NO</text>

  <!-- Main Content Section -->
  <!-- Left Column -->
  <rect x="20" y="150" width="430" height="340" class="border-light"/>

  <line x1="20" y1="170" x2="450" y2="170" class="border-light"/>
  <text x="30" y="163" class="doc-header" font-weight="bold">CONTRACT NOTE NO.</text>

  <line x1="20" y1="190" x2="450" y2="190" class="border-light"/>
  <text x="30" y="183" class="doc-header">Invoice Reference Number (IRN)</text>

  <line x1="20" y1="210" x2="450" y2="210" class="border-light"/>
  <text x="30" y="203" class="doc-header">TRADE DATE</text>

  <line x1="20" y1="270" x2="450" y2="270" class="border-light"/>
  <text x="30" y="233" class="doc-header">Name of the Client</text>
  <text x="30" y="248" class="doc-header">Address of the Client</text>
  <text x="30" y="263" class="doc-header">State/State Code (Place of supply)</text>

  <text x="30" y="293" class="doc-header">PAN of Client</text>
  <text x="30" y="308" class="doc-header">UCC of Client</text>
  <text x="30" y="323" class="doc-header">Trading Back office code*</text>
  <text x="30" y="338" class="doc-header">GST Identification No. of client (if available)</text>

  <!-- Right Column -->
  <rect x="460" y="150" width="420" height="340" class="border-light"/>

  <line x1="460" y1="170" x2="880" y2="170" class="border-light"/>
  <text x="470" y="163" class="doc-header" font-weight="bold">SETTLEMENT NO.</text>
  <text x="650" y="163" class="doc-header">Name Of Clearing Corporation & Segment</text>

  <line x1="460" y1="190" x2="880" y2="190" class="border-light"/>
  <text x="470" y="183" class="doc-header">SETTLEMENT DATE</text>
  <text x="650" y="183" class="doc-header">Name Of Clearing Corporation & Segment</text>

  <text x="470" y="213" class="doc-header">GIVE CLEARING CORPORATION-WISE /</text>
  <text x="470" y="226" class="doc-header">SEGMENTWISE SETTLEMENT NO. & DATES</text>

  <!-- Exchange Section -->
  <rect x="20" y="500" width="860" height="50" class="border-light"/>
  <line x1="20" y1="515" x2="880" y2="515" class="border-light"/>
  <text x="30" y="508" class="doc-header">*Trading/ Back Office Code (if Different from UCC)</text>
  <text x="470" y="508" class="doc-header">Name Of Exchange & Segment</text>
  <text x="650" y="508" class="doc-header">Name Of Exchange & Segment</text>
  <text x="770" y="508" class="doc-header">Name Of Exchange & Segment</text>

  <text x="470" y="533" class="doc-header">Name Of Exchange & Segment</text>

  <!-- Footer -->
  <text x="30" y="620" class="doc-subtitle">For official use only - Contract Note Reference</text>
</svg>